<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent identity verification and delegation</title>
  <desc id="desc">A user is verified before Agent A delegates limited permissions to Agent B in a three-step flow</desc>
