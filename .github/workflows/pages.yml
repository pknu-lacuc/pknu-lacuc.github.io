name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_first.outputs.page_url || steps.deployment_second.outputs.page_url || steps.deployment_final.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment_first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: ${{ steps.deployment_first.outcome == 'failure' }}
        run: sleep 30
      - name: Retry Pages deployment
        if: ${{ steps.deployment_first.outcome == 'failure' }}
        id: deployment_second
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before final retry
        if: ${{ steps.deployment_first.outcome == 'failure' && steps.deployment_second.outcome == 'failure' }}
        run: sleep 60
      - name: Final Pages deployment attempt
        if: ${{ steps.deployment_first.outcome == 'failure' && steps.deployment_second.outcome == 'failure' }}
        id: deployment_final
        uses: actions/deploy-pages@v4
