  <text x="129" y="237" fill="#004b8b" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="22" font-weight="700" text-anchor="middle">User</text>

  <rect x="243" y="79" width="154" height="179" rx="20" fill="#ffffff" stroke="#004b8b" stroke-width="3"/>
  <rect x="282" y="113" width="76" height="75" rx="15" fill="#e9f7fb" stroke="#004b8b" stroke-width="3"/>
  <path d="M298 104v9m22-9v9m22-9v9M298 188v9m22-9v9m22-9v9" stroke="#004b8b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="304" cy="143" r="5" fill="#00aadd"/><circle cx="336" cy="143" r="5" fill="#00aadd"/>
  <path d="M308 164c6 5 18 5 24 0" fill="none" stroke="#004b8b" stroke-width="3" stroke-linecap="round"/>
  <text x="320" y="237" fill="#004b8b" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Agent A</text>

  <rect x="434" y="79" width="154" height="179" rx="20" fill="#ffffff" stroke="#004b8b" stroke-width="3"/>
  <rect x="473" y="113" width="76" height="75" rx="15" fill="#e9f7fb" stroke="#004b8b" stroke-width="3"/>
  <path d="M489 104v9m22-9v9m22-9v9M489 188v9m22-9v9m22-9v9" stroke="#004b8b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="495" cy="143" r="5" fill="#00aadd"/><circle cx="527" cy="143" r="5" fill="#00aadd"/>
  <path d="M499 164c6 5 18 5 24 0" fill="none" stroke="#004b8b" stroke-width="3" stroke-linecap="round"/>
  <text x="511" y="237" fill="#004b8b" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Agent B</text>

  <path d="M207 179h29M398 179h29" fill="none" stroke="#00aadd" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="224" cy="125" r="18" fill="#00aadd"/>
  <path d="m215 125 6 6 12-14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
